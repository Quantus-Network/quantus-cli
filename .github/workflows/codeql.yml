name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No scheduled scans by design: every code change reaches main via push or PR,
# both of which trigger this workflow. Security advisories for Rust dependencies
# are independently caught by `cargo audit` in ci.yml.

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `actions` covers GitHub Actions workflow hygiene (e.g. the
          # `actions/missing-workflow-permissions` rule).
          - language: actions
            build-mode: none
          # `rust` is GA since Oct 2025 and supports build-mode `none`,
          # so we get source-level analysis without compiling the crate.
          # Note: `cargo audit` in ci.yml stays as the authoritative source
          # for known CVEs in dependencies; CodeQL adds taint analysis on
          # our own source.
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Deliberately narrowed from the prior `security-and-quality`
          # sweep, which was mostly quality noise in test modules and
          # examples/ (hard-coded test keys, intentional prints) that
          # reviewers learned to ignore. The default high-precision
          # security suite plus a path exclusion for examples/ keeps the
          # signal (taint analysis, Actions hygiene) without the noise.
          config: |
            paths-ignore:
              - examples
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
