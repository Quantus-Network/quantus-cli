[advisories]
ignore = [
	# ruzstd 0.8 decompression bomb. Reached only via subxt-lightclient -> smoldot,
	# an optional subxt feature this crate never enables, so it is in Cargo.lock
	# but never compiled. Every smoldot release pins ruzstd ^0.8.
	"RUSTSEC-2026-0344",
	# crypto-bigint 0.5.5 timing variability (constant-time arithmetic). The
	# patched line is >=0.7.6 and there is no 0.5 or 0.6 fix. elliptic-curve
	# 0.13.8 requires crypto-bigint ^0.5, k256 0.13.4 requires that
	# elliptic-curve, and every published sp-core through 43.0.0 requires
	# k256 ^0.13.4. Cargo cannot select 0.7 while those crates stay.
	"RUSTSEC-2026-0387",
	# url <=2.5.8 stack overflow in Url::origin() on nested blob: URLs. Neither
	# this crate nor any dependency calls Url::origin(). The fix, 2.5.9, clears
	# the 30-day dependency cooldown on 2026-12-21; bump url then and drop this.
	"RUSTSEC-2026-0592",
	# cookie <0.18.3 PrivateJar nonce reuse after fork. Reached only via
	# self_update -> ureq's optional cookies feature, which is never enabled, so
	# cookie is in Cargo.lock but never compiled. The fix, 0.18.3, clears the
	# 30-day dependency cooldown on 2026-12-24; bump cookie then and drop this.
	"RUSTSEC-2026-0594",
]
