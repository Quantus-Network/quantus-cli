# Vendored from crates.io qp-dilithium-crypto 0.6.1 (MIT).
# Its crystals dependencies are the Apache-2.0 rewrite published here as
# quantus-crystals-* 4.2.0. The published 4.1.1 crystals pin zeroize =1.8.2,
# which cannot unify with the vendored circuits.
[package]
authors = ["Quantus Network"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["cryptography", "no-std"]
description = "Dilithium signatures for Substrate, built on quantus-crystals 4.2.0"
edition = "2021"
homepage = "https://quantus.com"
keywords = [
	"cryptography",
	"dilithium",
	"post-quantum",
	"quantus-network",
	"substrate",
]
license = "MIT"
name = "quantus-dilithium-crypto"
publish = true
readme = false
repository = "https://github.com/Quantus-Network/quantus-cli"
version = "0.7.0"

[lib]
name = "qp_dilithium_crypto"
path = "src/lib.rs"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false }
log = { version = "0.4.22", default-features = false }
qp-poseidon-core = { version = "3.1.0", default-features = false }
qp-rusty-crystals-dilithium = { package = "quantus-crystals-dilithium", version = "=4.2.0", path = "../qp-rusty-crystals/dilithium", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
qp-rusty-crystals-hdwallet = { package = "quantus-crystals-hdwallet", version = "=4.2.0", path = "../qp-rusty-crystals/hdwallet", optional = true }
scale-info = { version = "2.11.6", default-features = false }
sp-core = { version = "39.0.0", default-features = false }
sp-runtime = { version = "45.0.0", default-features = false }
thiserror = { version = "2.0.12", optional = true }
zeroize = { version = "1.7", default-features = false, features = ["derive"] }

[features]
default = ["std"]
full_crypto = ["sp-core/full_crypto"]
serde = ["sp-core/serde"]
std = [
	"codec/std",
	"full_crypto",
	"qp-poseidon-core/std",
	"qp-rusty-crystals-hdwallet",
	"scale-info/std",
	"sp-core/std",
	"sp-runtime/std",
	"thiserror",
]
