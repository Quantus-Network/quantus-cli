# Vendored from Quantus-Network/qp-zk-circuits 3ba7cefaee5dc1d382ec4d29e19c0f02882b1e05 (MIT).
[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Wormhole leaf circuit (qp-zk-circuits 3ba7cef)"
edition = "2021"
license = "MIT"
name = "quantus-wormhole-circuit"
publish = true
readme = false
repository = "https://github.com/Quantus-Network/quantus-cli"
version = "4.5.0"

[lib]
name = "qp_wormhole_circuit"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false }
qp-plonky2 = { version = "=1.6.0", default-features = false }
qp-wormhole-inputs = { package = "quantus-wormhole-inputs", version = "=4.5.0", path = "../inputs", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
zk-circuits-common = { package = "quantus-zk-circuits-common", version = "=4.5.0", path = "../../common", default-features = false }

[features]
default = ["std"]
profile = ["qp-plonky2/rand", "qp-plonky2/timing", "std"]
std = [
	"anyhow/std",
	"qp-plonky2/std",
	"qp-wormhole-inputs/std",
	"zk-circuits-common/std",
]
