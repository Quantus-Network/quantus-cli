# Vendored from Quantus-Network/qp-zk-circuits 3ba7cefaee5dc1d382ec4d29e19c0f02882b1e05 (MIT).
[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Wormhole proof verifier (qp-zk-circuits 3ba7cef)"
edition = "2021"
license = "MIT"
name = "quantus-wormhole-verifier"
publish = true
readme = false
repository = "https://github.com/Quantus-Network/quantus-cli"
version = "4.5.0"

[lib]
name = "qp_wormhole_verifier"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false }
qp-plonky2-verifier = { version = "=1.6.0", default-features = false }
qp-wormhole-inputs = { package = "quantus-wormhole-inputs", version = "=4.5.0", path = "../inputs", default-features = false }
tiny-keccak = { version = "=2.0.2", default-features = false, features = ["keccak"] }

[features]
default = ["std"]
std = [
	"anyhow/std",
	"qp-plonky2-verifier/std",
	"qp-wormhole-inputs/std",
]
