# Vendored from Quantus-Network/qp-zk-circuits 3ba7cefaee5dc1d382ec4d29e19c0f02882b1e05 (MIT).
[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Wormhole private and public batch aggregation (qp-zk-circuits 3ba7cef)"
edition = "2021"
license = "MIT"
name = "quantus-wormhole-aggregator"
publish = true
readme = false
repository = "https://github.com/Quantus-Network/quantus-cli"
version = "4.5.0"

[lib]
name = "qp_wormhole_aggregator"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false }
hex = "=0.4.3"
qp-plonky2 = { version = "=1.6.0", default-features = false }
qp-wormhole-inputs = { package = "quantus-wormhole-inputs", version = "=4.5.0", path = "../inputs" }
rand = { version = "=0.10.1", default-features = false, features = ["thread_rng"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
wormhole-circuit = { package = "quantus-wormhole-circuit", version = "=4.5.0", path = "../circuit", default-features = false }
wormhole-prover = { package = "quantus-wormhole-prover", version = "=4.5.0", path = "../prover", default-features = false }
zk-circuits-common = { package = "quantus-zk-circuits-common", version = "=4.5.0", path = "../../common" }

[features]
default = ["std"]
# Declared so upstream `cfg(feature = "gpu")` gates stay valid. The GPU crate
# is not vendored, and this feature is not enabled.
gpu = []
no_zk = []
profile = ["qp-plonky2/rand", "qp-plonky2/timing", "std"]
std = [
	"anyhow/std",
	"qp-plonky2/rand",
	"qp-plonky2/std",
	"wormhole-circuit/std",
	"wormhole-prover/std",
	"zk-circuits-common/std",
]
