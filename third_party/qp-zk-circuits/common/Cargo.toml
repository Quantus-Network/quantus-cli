# Vendored from Quantus-Network/qp-zk-circuits 3ba7cefaee5dc1d382ec4d29e19c0f02882b1e05 (MIT).
[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Shared circuit helpers (qp-zk-circuits 3ba7cef)"
edition = "2021"
license = "MIT"
name = "quantus-zk-circuits-common"
publish = true
readme = false
repository = "https://github.com/Quantus-Network/quantus-cli"
version = "4.5.0"

[lib]
name = "qp_zk_circuits_common"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false }
qp-plonky2 = { version = "=1.6.0", default-features = false }
qp-poseidon-core = { version = "=3.1.0", default-features = false }
qp-wormhole-inputs = { package = "quantus-wormhole-inputs", version = "=4.5.0", path = "../wormhole/inputs", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
formal-export = ["qp-plonky2/formal-export", "std"]
std = [
	"anyhow/std",
	"qp-plonky2/std",
	"qp-poseidon-core/std",
	"qp-wormhole-inputs/std",
	"serde/std",
	"serde_json/std",
]
